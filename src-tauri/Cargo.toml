[package]
name = "rec"
description = "Record a screen region, paste the file path into your AI agent."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "rec"

[lib]
name = "rec_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
rec-capture = { path = "../crates/capture" }
tauri = { version = "2.12", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-updater = "2.14"
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-process = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-log = "2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
trash = "5"
log = "0.4"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[dev-dependencies]
tempfile = "3"
