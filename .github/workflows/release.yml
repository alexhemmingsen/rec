name: Release

# Push a tag like v0.1.0 (matching the version in src-tauri/tauri.conf.json)
# to build, sign and publish a macOS release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    env:
      # Not RCODESIGN_*: rcodesign reads those variables as its own config.
      APPLE_CODESIGN_VERSION: 0.29.0
      APPLE_CODESIGN_SHA256: d1a532150adaf90048260d76359261aa716abafc45c53c5dc18845029184334a
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches the app version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$VERSION"; exit 1; }

      - name: Test
        run: |
          pnpm test
          cargo test --workspace

      - name: Install rcodesign
        run: |
          mkdir -p "$RUNNER_TEMP/rcodesign" && cd "$RUNNER_TEMP/rcodesign"
          NAME="apple-codesign-${APPLE_CODESIGN_VERSION}-aarch64-apple-darwin"
          curl -fsSL -o "$NAME.tar.gz" "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${APPLE_CODESIGN_VERSION}/$NAME.tar.gz"
          echo "$APPLE_CODESIGN_SHA256  $NAME.tar.gz" | shasum -a 256 -c -
          tar -xzf "$NAME.tar.gz"
          echo "RCODESIGN=$RUNNER_TEMP/rcodesign/$NAME/rcodesign" >> "$GITHUB_ENV"

      - name: Write signing keys
        env:
          REC_SIGN_P12_BASE64: ${{ secrets.REC_SIGN_P12_BASE64 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          umask 077
          echo "$REC_SIGN_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/rec.p12"
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/updater.key"
          echo "REC_SIGN_P12=$RUNNER_TEMP/rec.p12" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$RUNNER_TEMP/updater.key" >> "$GITHUB_ENV"

      - name: Build and sign
        env:
          REC_SIGN_P12_PASSWORD: ${{ secrets.REC_SIGN_P12_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          REC_REPO: ${{ github.repository }}
        run: ./scripts/release-macos.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Rec ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md

      - name: Remove keys
        if: always()
        run: rm -f "$RUNNER_TEMP/rec.p12" "$RUNNER_TEMP/updater.key"
