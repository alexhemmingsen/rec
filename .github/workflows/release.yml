name: Release

# Every push to main with a new version releases it: when the version in
# src-tauri/tauri.conf.json (and Cargo.toml, package.json) has no vX.Y.Z
# release yet, this builds, signs and notarizes Rec for macOS, Windows and
# Linux, publishes it, and creates the tag. Pushes that keep the version
# (docs, CI, work towards the next release) stop after the first job.
on:
  push:
    branches: [main]
  # Retry a release that failed part-way (same rule: only an unreleased version).
  workflow_dispatch:

permissions:
  contents: write

# One release run at a time: a second push waits, then sees the version is out.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$PKG" != "$VERSION" ] || [ "$CARGO" != "$VERSION" ]; then
            echo "::error::versions differ: tauri.conf.json $VERSION, package.json $PKG, Cargo.toml $CARGO"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released: nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$VERSION."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  macos:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: macos-latest
    env:
      # Not RCODESIGN_*: rcodesign reads those variables as its own config.
      APPLE_CODESIGN_VERSION: 0.29.0
      APPLE_CODESIGN_SHA256: d1a532150adaf90048260d76359261aa716abafc45c53c5dc18845029184334a
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # dmgbuild (the DMG window's layout) needs Python 3.10+.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && cargo test --workspace
      - name: Install rcodesign
        run: |
          mkdir -p "$RUNNER_TEMP/rcodesign" && cd "$RUNNER_TEMP/rcodesign"
          NAME="apple-codesign-${APPLE_CODESIGN_VERSION}-aarch64-apple-darwin"
          curl -fsSL -o "$NAME.tar.gz" "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${APPLE_CODESIGN_VERSION}/$NAME.tar.gz"
          echo "$APPLE_CODESIGN_SHA256  $NAME.tar.gz" | shasum -a 256 -c -
          tar -xzf "$NAME.tar.gz"
          echo "RCODESIGN=$RUNNER_TEMP/rcodesign/$NAME/rcodesign" >> "$GITHUB_ENV"
      - name: Write signing keys
        env:
          REC_SIGN_P12_BASE64: ${{ secrets.REC_SIGN_P12_BASE64 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Optional: set once Rec has an Apple Developer ID (see AGENTS.md).
          REC_NOTARY_API_KEY_JSON: ${{ secrets.REC_NOTARY_API_KEY_JSON }}
        run: |
          umask 077
          echo "$REC_SIGN_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/rec.p12"
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/updater.key"
          echo "REC_SIGN_P12=$RUNNER_TEMP/rec.p12" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$RUNNER_TEMP/updater.key" >> "$GITHUB_ENV"
          if [ -n "$REC_NOTARY_API_KEY_JSON" ]; then
            printf '%s' "$REC_NOTARY_API_KEY_JSON" > "$RUNNER_TEMP/notary.json"
            echo "REC_NOTARY_API_KEY=$RUNNER_TEMP/notary.json" >> "$GITHUB_ENV"
          fi
      - name: Build and sign
        env:
          REC_SIGN_P12_PASSWORD: ${{ secrets.REC_SIGN_P12_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/release-macos.sh
      - name: Remove keys
        if: always()
        run: rm -f "$RUNNER_TEMP/rec.p12" "$RUNNER_TEMP/updater.key" "$RUNNER_TEMP/notary.json"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/*

  windows:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && cargo test --workspace
      - name: Build the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional: an Authenticode certificate (.pfx, base64) and its
          # password. With them the installer is signed; without, unsigned.
          REC_WINDOWS_PFX_BASE64: ${{ secrets.REC_WINDOWS_PFX_BASE64 }}
          REC_WINDOWS_PFX_PASSWORD: ${{ secrets.REC_WINDOWS_PFX_PASSWORD }}
        run: |
          CONFIG='{"bundle":{"createUpdaterArtifacts":true}}'
          if [ -n "$REC_WINDOWS_PFX_BASE64" ]; then
            echo "$REC_WINDOWS_PFX_BASE64" | base64 --decode > "$RUNNER_TEMP/rec.pfx"
            THUMB=$(powershell -NoProfile -Command "(Import-PfxCertificate -FilePath '$RUNNER_TEMP\rec.pfx' -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String \$env:REC_WINDOWS_PFX_PASSWORD -AsPlainText -Force)).Thumbprint" | tr -d '\r')
            rm -f "$RUNNER_TEMP/rec.pfx"
            CONFIG="{\"bundle\":{\"createUpdaterArtifacts\":true,\"windows\":{\"certificateThumbprint\":\"$THUMB\",\"digestAlgorithm\":\"sha256\",\"timestampUrl\":\"http://timestamp.digicert.com\"}}}"
            echo "Signing with certificate $THUMB"
          else
            echo "No Windows certificate configured: the installer is unsigned"
          fi
          pnpm tauri build --bundles nsis --config "$CONFIG"
      - name: Collect
        run: |
          mkdir -p release
          cp target/release/bundle/nsis/*-setup.exe target/release/bundle/nsis/*-setup.exe.sig release/
          ls -la release
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*

  linux:
    needs: version
    if: needs.version.outputs.release == 'true'
    # Same image CI tests on; the packages need Ubuntu 24.04 / glibc 2.39 or newer.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly gstreamer1.0-plugins-bad gstreamer1.0-x gstreamer1.0-pipewire
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && cargo test --workspace
      - name: Build the packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles deb,appimage --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Collect
        run: |
          mkdir -p release
          cp target/release/bundle/deb/*.deb* target/release/bundle/appimage/*.AppImage* release/
          ls -la release
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/*

  publish:
    needs: [version, macos, windows, linux]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Updater manifest
        run: node scripts/latest-json.mjs dist "${{ needs.version.outputs.version }}" "${{ github.repository }}"
      # Copies with names that never change, so a website can link to
      # https://github.com/<repo>/releases/latest/download/Rec-macOS.dmg and
      # always get the newest release. After the manifest: they have no .sig,
      # and the updater keeps using the versioned files.
      - name: Fixed-name downloads
        run: |
          cp dist/Rec_*_aarch64.dmg dist/Rec-macOS.dmg
          cp dist/Rec_*_x64-setup.exe dist/Rec-Windows-setup.exe
          cp dist/Rec_*_amd64.AppImage dist/Rec-Linux.AppImage
          cp dist/Rec_*_amd64.deb dist/Rec-Linux.deb
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          # Creates the tag vX.Y.Z on this commit.
          gh release create "v${{ needs.version.outputs.version }}" dist/* \
            --target "$GITHUB_SHA" \
            --title "Rec ${{ needs.version.outputs.version }}" \
            --notes-file .github/release-notes.md
