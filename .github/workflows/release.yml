name: Release

# Push a tag like v0.2.0 (matching the version in src-tauri/tauri.conf.json)
# to build, sign and publish Rec for macOS, Windows and Linux.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-latest
    env:
      # Not RCODESIGN_*: rcodesign reads those variables as its own config.
      APPLE_CODESIGN_VERSION: 0.29.0
      APPLE_CODESIGN_SHA256: d1a532150adaf90048260d76359261aa716abafc45c53c5dc18845029184334a
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && cargo test --workspace
      - name: Install rcodesign
        run: |
          mkdir -p "$RUNNER_TEMP/rcodesign" && cd "$RUNNER_TEMP/rcodesign"
          NAME="apple-codesign-${APPLE_CODESIGN_VERSION}-aarch64-apple-darwin"
          curl -fsSL -o "$NAME.tar.gz" "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${APPLE_CODESIGN_VERSION}/$NAME.tar.gz"
          echo "$APPLE_CODESIGN_SHA256  $NAME.tar.gz" | shasum -a 256 -c -
          tar -xzf "$NAME.tar.gz"
          echo "RCODESIGN=$RUNNER_TEMP/rcodesign/$NAME/rcodesign" >> "$GITHUB_ENV"
      - name: Write signing keys
        env:
          REC_SIGN_P12_BASE64: ${{ secrets.REC_SIGN_P12_BASE64 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Optional: set once Rec has an Apple Developer ID (see AGENTS.md).
          REC_NOTARY_API_KEY_JSON: ${{ secrets.REC_NOTARY_API_KEY_JSON }}
        run: |
          umask 077
          echo "$REC_SIGN_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/rec.p12"
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/updater.key"
          echo "REC_SIGN_P12=$RUNNER_TEMP/rec.p12" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$RUNNER_TEMP/updater.key" >> "$GITHUB_ENV"
          if [ -n "$REC_NOTARY_API_KEY_JSON" ]; then
            printf '%s' "$REC_NOTARY_API_KEY_JSON" > "$RUNNER_TEMP/notary.json"
            echo "REC_NOTARY_API_KEY=$RUNNER_TEMP/notary.json" >> "$GITHUB_ENV"
          fi
      - name: Build and sign
        env:
          REC_SIGN_P12_PASSWORD: ${{ secrets.REC_SIGN_P12_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/release-macos.sh
      - name: Remove keys
        if: always()
        run: rm -f "$RUNNER_TEMP/rec.p12" "$RUNNER_TEMP/updater.key" "$RUNNER_TEMP/notary.json"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/*

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && cargo test --workspace
      - name: Build the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional: an Authenticode certificate (.pfx, base64) and its
          # password. With them the installer is signed; without, unsigned.
          REC_WINDOWS_PFX_BASE64: ${{ secrets.REC_WINDOWS_PFX_BASE64 }}
          REC_WINDOWS_PFX_PASSWORD: ${{ secrets.REC_WINDOWS_PFX_PASSWORD }}
        run: |
          CONFIG='{"bundle":{"createUpdaterArtifacts":true}}'
          if [ -n "$REC_WINDOWS_PFX_BASE64" ]; then
            echo "$REC_WINDOWS_PFX_BASE64" | base64 --decode > "$RUNNER_TEMP/rec.pfx"
            THUMB=$(powershell -NoProfile -Command "(Import-PfxCertificate -FilePath '$RUNNER_TEMP\rec.pfx' -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String \$env:REC_WINDOWS_PFX_PASSWORD -AsPlainText -Force)).Thumbprint" | tr -d '\r')
            rm -f "$RUNNER_TEMP/rec.pfx"
            CONFIG="{\"bundle\":{\"createUpdaterArtifacts\":true,\"windows\":{\"certificateThumbprint\":\"$THUMB\",\"digestAlgorithm\":\"sha256\",\"timestampUrl\":\"http://timestamp.digicert.com\"}}}"
            echo "Signing with certificate $THUMB"
          else
            echo "No Windows certificate configured: the installer is unsigned"
          fi
          pnpm tauri build --bundles nsis --config "$CONFIG"
      - name: Collect
        run: |
          mkdir -p release
          cp target/release/bundle/nsis/*-setup.exe target/release/bundle/nsis/*-setup.exe.sig release/
          ls -la release
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*

  linux:
    needs: version
    # Same image CI tests on; the packages need Ubuntu 24.04 / glibc 2.39 or newer.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly gstreamer1.0-plugins-bad gstreamer1.0-x gstreamer1.0-pipewire
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && cargo test --workspace
      - name: Build the packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles deb,appimage --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Collect
        run: |
          mkdir -p release
          cp target/release/bundle/deb/*.deb* target/release/bundle/appimage/*.AppImage* release/
          ls -la release
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/*

  publish:
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Updater manifest
        run: node scripts/latest-json.mjs dist "${{ needs.version.outputs.version }}" "${{ github.repository }}"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Rec ${{ needs.version.outputs.version }}" \
            --notes-file .github/release-notes.md
