[package]
name = "rec-capture"
description = "Screen region recording to MP4 for Rec"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
log = "0.4"
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-video"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"



[target.'cfg(windows)'.dependencies]
windows-capture = "2.0"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Performance",
    "Win32_UI_HiDpi",
] }
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
png = "0.18"
gstreamer = "0.25"
gstreamer-app = "0.25"
x11rb = { version = "0.14", features = ["randr"] }
ashpd = { version = "0.14", default-features = false, features = ["tokio", "screencast"] }
tokio = { version = "1", features = ["rt", "time"] }
log = "0.4"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-video = "0.3"
objc2-core-media = "0.3"
objc2-core-foundation = "0.3"
